name: Project 04 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "projects/04-muslim-recovery-protection/**"
      - ".github/workflows/project-04-android-debug.yml"
  pull_request:
    paths:
      - "projects/04-muslim-recovery-protection/**"
      - ".github/workflows/project-04-android-debug.yml"

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Test, lint, and build debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/04-muslim-recovery-protection/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify and build
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muslim-recovery-protection-debug-apk
          path: projects/04-muslim-recovery-protection/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

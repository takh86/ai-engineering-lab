name: Tabsira extension final features
on:
  pull_request:
    paths:
      - 'projects/04-muslim-recovery-protection/chrome-extension/**'
      - '.github/workflows/project-04-tabsira-final-features.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/04-muslim-recovery-protection/chrome-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/04-muslim-recovery-protection/chrome-extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify-reproducible
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node tests/e2e/final-features.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabsira-1.1.0-reviewed-candidate
          path: |
            projects/04-muslim-recovery-protection/chrome-extension/dist/*.zip
            projects/04-muslim-recovery-protection/chrome-extension/test-evidence/final-features*
          retention-days: 14

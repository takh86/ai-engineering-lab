name: Tabsira extension final features
on:
  pull_request:
    paths:
      - 'projects/04-muslim-recovery-protection/chrome-extension/**'
      - '.github/workflows/project-04-tabsira-final-features.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tabsira-final-features-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/04-muslim-recovery-protection/chrome-extension
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/04-muslim-recovery-protection/chrome-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: |
          node tests/review/controller-regressions.mjs > test-evidence/final-features-controller-review.json
          cat test-evidence/final-features-controller-review.json
      - run: |
          node tests/review/worker-capabilities.mjs > test-evidence/final-features-worker-review.json
          cat test-evidence/final-features-worker-review.json
      - run: npm run build
      - run: npm run verify-reproducible
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node tests/e2e/final-features.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tabsira-1.1.0-reviewed-candidate
          path: |
            projects/04-muslim-recovery-protection/chrome-extension/dist/*.zip
            projects/04-muslim-recovery-protection/chrome-extension/test-evidence/final-features*
          retention-days: 14

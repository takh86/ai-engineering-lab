name: Project 04 Android CI

# M3-01 W0a. Objective build/test/lint gate for the Tabsira Android app (GitHub CI is the only
# build environment; nothing is claimed as locally verified).
#
# This workflow NEVER uploads a playRelease binary: the play flavor is engineering evidence only and no
# Play upload is authorized (see docs/android/release-boundary.md).
# The legacy M1 workflow (project-04-m1-07-verification.yml) was made flavor-aware in the W0a closure round
# (internal flavor only, Amendment A2); it remains the historical INTERNAL experiment gate.

on:
  push:
    branches-ignore:
      - main
    paths:
      - "projects/04-muslim-recovery-protection/android/**"
      - ".github/workflows/project-04-android-ci.yml"
  pull_request:
    paths:
      - "projects/04-muslim-recovery-protection/android/**"
      - ".github/workflows/project-04-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-04-android-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # W0b: enforce with ZERO historical exceptions (the W0a baseline file no longer exists).
  BOUNDARY_MODE: enforce

jobs:
  tools-and-guard:
    name: Tool self-tests and diff guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (full history for the diff guard)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release-boundary checker self-test (passes by rejecting known-bad fixtures)
        working-directory: projects/04-muslim-recovery-protection/android/release-boundary
        run: python3 -m unittest -v

      - name: CI helper self-test
        working-directory: projects/04-muslim-recovery-protection/android/ci
        run: python3 -m unittest -v

      - name: Diff guard (W0b - frozen paths unchanged; historical code only moved as approved)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          echo "merge-base with origin/main: $base"
          # --no-renames (inside the script) lists both sides of a move, so a move out of a frozen dir is seen.
          python3 projects/04-muslim-recovery-protection/android/ci/w0b_diff_guard.py "$base"

      - name: Diff guard for the legacy M1 workflow (only the approved flavor-aware migration is allowed)
        run: |
          set -euo pipefail
          m1=.github/workflows/project-04-m1-07-verification.yml
          base="$(git merge-base origin/main HEAD)"
          # Every added/removed line of that file must be one of the four lines of the approved migration
          # (Owner decision C1, W0a closure). Any other edit to it fails; this is not a workflow bypass.
          git diff --no-renames -U0 "$base" HEAD -- "$m1" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | sort -u > "$RUNNER_TEMP/m1-actual.txt" || true
          cat > "$RUNNER_TEMP/m1-approved.txt" <<'APPROVED'
          +        run: ./gradlew clean assembleInternalDebug testInternalDebugUnitTest lintInternalDebug --no-daemon
          +          path: projects/04-muslim-recovery-protection/android/app/build/outputs/apk/internal/debug/app-internal-debug.apk
          -        run: ./gradlew clean assembleDebug testDebugUnitTest lintDebug --no-daemon
          -          path: projects/04-muslim-recovery-protection/android/app/build/outputs/apk/debug/app-debug.apk
          APPROVED
          sed -i 's/^          //' "$RUNNER_TEMP/m1-approved.txt"
          sort -u -o "$RUNNER_TEMP/m1-approved.txt" "$RUNNER_TEMP/m1-approved.txt"
          unapproved="$(comm -23 "$RUNNER_TEMP/m1-actual.txt" "$RUNNER_TEMP/m1-approved.txt")"
          if [ -n "$unapproved" ]; then
            echo "::error::Unapproved change to the legacy M1 workflow:"; echo "$unapproved"; exit 1
          fi
          echo "M1 workflow diff is empty or exactly the approved migration."

      - name: Surface changes to the release boundary itself (reviewer attention, not a gate)
        run: |
          set -euo pipefail
          if grep -E '^(projects/04-muslim-recovery-protection/android/release-boundary/|projects/04-muslim-recovery-protection/android/app/build\.gradle\.kts$|\.github/workflows/)' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/boundary-changes.txt"; then
            while read -r f; do echo "::warning file=$f::Release-boundary-relevant file changed: this needs explicit Owner review (allow-lists, baseline, flavors, workflows)."; done < "$RUNNER_TEMP/boundary-changes.txt"
          fi

  baseline-main:
    name: Baseline test counts on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/04-muslim-recovery-protection/android
    steps:
      # Pinned to the commit this work branched from (the pre-flavor tree), not to moving main:
      # the baseline must stay valid after flavors merge, when `testDebugUnitTest` no longer exists.
      - name: Checkout the pre-W0a baseline commit
        uses: actions/checkout@v5
        with:
          ref: 78e1942e26ae5e9924a6df6e6d77156b5d0ece29

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests on main
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload baseline JUnit XML (summarized later with the branch's script)
        uses: actions/upload-artifact@v4
        with:
          name: baseline-test-results
          path: projects/04-muslim-recovery-protection/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Build, test, lint, task graph and release boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/04-muslim-recovery-protection/android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Record the actual Gradle task graph after flavors (Amendment A2 evidence)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          ./gradlew --no-daemon -q :app:tasks --all > "$RUNNER_TEMP/evidence/tasks-all.txt"
          for task in assembleDebug testDebugUnitTest lintDebug assembleRelease; do
            ./gradlew --no-daemon "$task" --dry-run > "$RUNNER_TEMP/evidence/dry-run-$task.txt" || echo "dry-run of $task failed" >> "$RUNNER_TEMP/evidence/dry-run-$task.txt"
          done
          {
            echo "## Gradle task graph after flavors"
            for task in assembleDebug testDebugUnitTest lintDebug assembleRelease; do
              echo "### \`$task\` --dry-run resolves to:"
              echo '```'
              grep -E '^:app:(assemble|test|lint|bundle)[A-Za-z]*(Debug|Release)[A-Za-z]* ' "$RUNNER_TEMP/evidence/dry-run-$task.txt" || true
              echo '```'
            done
            echo "### variant-specific aggregate tasks that exist"
            echo '```'
            grep -E '^(assemble|test|lint|bundle)(Play|Internal)[A-Za-z]* ' "$RUNNER_TEMP/evidence/tasks-all.txt" | sort -u || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/evidence/task-graph-summary.md"

      - name: Assert flavor invariants from the task graph and build file
        run: |
          set -euo pipefail
          if grep -q 'InternalRelease' "$RUNNER_TEMP/evidence/tasks-all.txt"; then
            echo "::error::an internalRelease task exists: internal must have no releasable variant"; exit 1
          fi
          grep -q 'assemblePlayRelease' "$RUNNER_TEMP/evidence/tasks-all.txt" || { echo "::error::assemblePlayRelease task missing"; exit 1; }
          grep -q 'assembleInternalDebug' "$RUNNER_TEMP/evidence/tasks-all.txt" || { echo "::error::assembleInternalDebug task missing"; exit 1; }
          if grep -nE 'isMinifyEnabled *= *true' app/build.gradle.kts; then
            echo "::error::R8/minification is on: class-name release-boundary scanning is no longer sufficient (D-10)"; exit 1
          fi
          echo "Flavor invariants OK: no internalRelease task, play/internal tasks present, R8 off."

      - name: "Build, unit-test and lint both flavors (instrumentation tests are compiled, not run - D-17)"
        run: >
          ./gradlew
          testInternalDebugUnitTest testPlayDebugUnitTest
          lintInternalDebug lintPlayRelease
          assembleInternalDebug assemblePlayRelease bundlePlayRelease
          assembleInternalDebugAndroidTest assemblePlayDebugAndroidTest
          --no-daemon

      - name: Summarize current test counts per flavor
        run: |
          set -euo pipefail
          python3 ci/test_counts.py summarize app/build/test-results/testInternalDebugUnitTest > "$RUNNER_TEMP/evidence/current-test-counts-internal.json"
          python3 ci/test_counts.py summarize app/build/test-results/testPlayDebugUnitTest > "$RUNNER_TEMP/evidence/current-test-counts-play.json"
          python3 - <<'PY'
          import json, os
          d = os.environ["RUNNER_TEMP"] + "/evidence/"
          for flavor in ("internal", "play"):
              data = json.load(open(d + "current-test-counts-%s.json" % flavor))
              print("%s: %d classes, %d tests, %d failures, %d errors, %d skipped" % (
                  flavor, len(data), sum(c["tests"] for c in data.values()),
                  sum(c["failures"] for c in data.values()), sum(c["errors"] for c in data.values()),
                  sum(c["skipped"] for c in data.values())))
          PY

      - name: Resolve the playRelease runtime dependencies
        run: ./gradlew --no-daemon -q :app:dependencies --configuration playReleaseRuntimeClasspath > "$RUNNER_TEMP/evidence/play-release-dependencies.txt"

      - name: Release-boundary check on the play artifacts (zero historical exceptions) and internal inclusion check
        run: |
          set -euo pipefail
          # W0b: structural isolation. The W0a baseline must be gone; the checker then has no exceptions.
          if [ -f release-boundary/w0a-known-historical.txt ]; then
            echo "::error::release-boundary/w0a-known-historical.txt must not exist after W0b"; exit 1
          fi
          apkanalyzer="$(find "$ANDROID_HOME" -path '*/bin/apkanalyzer' -type f | head -1)"
          if [ -z "$apkanalyzer" ]; then
            sdkmanager "cmdline-tools;latest"
            apkanalyzer="$(find "$ANDROID_HOME" -path '*/bin/apkanalyzer' -type f | head -1)"
          fi
          test -n "$apkanalyzer" || { echo "::error::apkanalyzer not available"; exit 1; }

          apk="$(ls app/build/outputs/apk/play/release/*.apk | head -1)"
          aab="$(ls app/build/outputs/bundle/playRelease/*.aab | head -1)"
          echo "play release artifacts (engineering evidence only, never uploaded): $apk $aab"
          "$apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/evidence/play-release-manifest.xml"
          version="$("$apkanalyzer" manifest version-name "$apk")"
          echo "play versionName: $version"
          python3 release-boundary/check_release_boundary.py \
            --label play-release \
            --apk "$apk" \
            --bundle "$aab" \
            --manifest-xml "$RUNNER_TEMP/evidence/play-release-manifest.xml" \
            --dependencies-file "$RUNNER_TEMP/evidence/play-release-dependencies.txt" \
            --r8-mapping app/build/outputs/mapping/playRelease/mapping.txt \
            --version-name "$version" \
            --expected-package com.muslimrecovery.protection \
            --mode "$BOUNDARY_MODE" \
            --report-out "$RUNNER_TEMP/evidence/release-boundary-report.txt"

          iapk="$(ls app/build/outputs/apk/internal/debug/*.apk | head -1)"
          echo "internal debug artifact: $iapk"
          "$apkanalyzer" manifest print "$iapk" > "$RUNNER_TEMP/evidence/internal-debug-manifest.xml"
          iversion="$("$apkanalyzer" manifest version-name "$iapk")"
          python3 release-boundary/check_internal_artifact.py \
            --apk "$iapk" \
            --manifest-xml "$RUNNER_TEMP/evidence/internal-debug-manifest.xml" \
            --version-name "$iversion" | tee "$RUNNER_TEMP/evidence/internal-artifact-report.txt"

      - name: Print Gradle task-graph evidence (Amendment A2)
        if: always()
        run: cat "$RUNNER_TEMP/evidence/task-graph-summary.md" || true

      - name: Upload evidence (text and reports only; no APK or AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-evidence
          path: |
            ${{ runner.temp }}/evidence/
            projects/04-muslim-recovery-protection/android/app/build/reports/
            projects/04-muslim-recovery-protection/android/app/build/test-results/
          retention-days: 14

  m1-equivalence:
    name: M1 command equivalence (assembleDebug testDebugUnitTest lintDebug after flavors)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/04-muslim-recovery-protection/android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Probe each M1 task name after flavors (dry run; records resolution, never gates)
        run: |
          mkdir -p "$RUNNER_TEMP/m1"
          for task in assembleDebug testDebugUnitTest lintDebug; do
            if ./gradlew --no-daemon "$task" --dry-run > "$RUNNER_TEMP/m1/$task.txt" 2>&1; then
              echo "M1 TASK $task: RESOLVES -> $(grep -oE '^:app:[A-Za-z]+' "$RUNNER_TEMP/m1/$task.txt" | grep -E 'assemble|test|lint' | sort -u | tr '\n' ' ')"
            else
              echo "M1 TASK $task: DOES NOT RESOLVE -> $(grep -m1 -A1 'What went wrong' "$RUNNER_TEMP/m1/$task.txt" | tail -1)"
            fi
          done | tee "$RUNNER_TEMP/m1/probe.txt"

      - name: Run the flavor-aware equivalent of the M1 build, test and lint command
        run: >
          ./gradlew clean
          assembleInternalDebug assemblePlayDebug
          testInternalDebugUnitTest testPlayDebugUnitTest
          lintInternalDebug lintPlayDebug
          --no-daemon

      - name: Record the M1 equivalence evidence
        if: always()
        run: |
          {
            echo "## M1 command equivalence evidence"
            cat "$RUNNER_TEMP/m1/probe.txt" || true
            echo "APKs produced by the flavor-aware equivalent:"
            find app/build/outputs/apk -name '*.apk' | sort || true
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "M1 upload path app/build/outputs/apk/debug/app-debug.apk: EXISTS"
            else
              echo "M1 upload path app/build/outputs/apk/debug/app-debug.apk: MISSING (the M1 workflow upload step would fail as written)"
            fi
            echo "Test result directories:"
            ls -d app/build/test-results/*/ 2>/dev/null || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

  compare-test-counts:
    name: Existing tests preserved (vs main baseline)
    needs: [baseline-main, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download baseline JUnit XML
        uses: actions/download-artifact@v4
        with:
          name: baseline-test-results
          path: baseline-results

      - name: Download current evidence
        uses: actions/download-artifact@v4
        with:
          name: android-ci-evidence
          path: current

      - name: Compare per flavor (every baseline test class must be present, same count, all green)
        run: |
          set -euo pipefail
          tool=projects/04-muslim-recovery-protection/android/ci/test_counts.py
          python3 "$tool" summarize baseline-results > baseline.json
          current_internal="$(find current -name "current-test-counts-internal.json" | head -1)"
          current_play="$(find current -name "current-test-counts-play.json" | head -1)"
          echo "== internal (must contain every baseline class, including the moved vpn/dns tests) =="
          python3 "$tool" compare baseline.json "$current_internal"
          echo "== play (the moved historical vpn/dns tests must be ABSENT; everything else preserved) =="
          python3 "$tool" compare baseline.json "$current_play" \
            --exclude-prefix com.muslimrecovery.protection.vpn. \
            --exclude-prefix com.muslimrecovery.protection.dns.

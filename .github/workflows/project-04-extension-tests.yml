name: Project 04 Tabsira Extension Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "projects/04-muslim-recovery-protection/chrome-extension/**"
      - ".github/workflows/project-04-extension-tests.yml"
  push:
    branches: [main]
    paths:
      - "projects/04-muslim-recovery-protection/chrome-extension/**"
      - ".github/workflows/project-04-extension-tests.yml"

permissions:
  contents: read

concurrency:
  group: project-04-extension-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests and reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: projects/04-muslim-recovery-protection/chrome-extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit, static and build tests
        run: npm test

      - name: Verify the packages build byte-for-byte reproducibly
        run: npm run verify-reproducible

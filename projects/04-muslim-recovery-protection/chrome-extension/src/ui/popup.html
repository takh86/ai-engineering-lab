<!doctype html>
<html lang="ar" dir="rtl" data-title="extShortName">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabsira</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="popup">
  <header class="brandbar"><img class="mark" src="brand/mark.svg" alt="" width="40" height="38"><span class="wordmark" data-i18n="extShortName"></span><span class="tag" data-i18n="popup_tagline"></span></header>
  <div class="status" id="status" role="status" aria-live="polite" data-state="unknown">
      <svg class="state-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"></svg>
      <div class="state-body"><span class="state-text" data-i18n="common_loading"></span><ul class="reasons" id="reasons" hidden></ul></div>
    </div>
  <p id="lock" class="muted"></p>
  <div class="actions">
    <a class="button" id="help" href="help.html" target="_blank" rel="noopener" data-i18n="common_help_now"></a>
    <button class="secondary" id="settings" type="button" data-i18n="common_settings"></button>
    <button class="secondary" id="repair" type="button" hidden data-i18n="common_repair"></button>
  </div>
  <p class="hint" data-i18n="popup_limits"></p>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
